name: 自动更新 Steam 动态并部署
on:
  # 定时触发：每6小时执行一次（cron表达式，UTC时间，对应北京时间+8小时）
  schedule:
    - cron: '0 */6 * * *'
  # 手动触发（可选）
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install

      - name: 构建并部署
        env:
          # 把 Steam API Key 存为 GitHub 秘钥（避免泄露）
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
        run: |
          hexo clean
          hexo generate
          hexo deploy